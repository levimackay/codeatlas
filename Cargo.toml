[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/platform",
    "crates/discovery",
    "crates/cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/levimackay/codeatlas"
authors = ["Levi Mackay"]

[workspace.dependencies]
codeatlas-core = { path = "crates/core" }
codeatlas-db = { path = "crates/db" }
codeatlas-platform = { path = "crates/platform" }
codeatlas-discovery = { path = "crates/discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
