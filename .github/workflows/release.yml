name: Release

on:
  push:
    tags:
      - "v*"

# NOTE: This workflow produces UNSIGNED builds. No Apple Developer ID
# certificate and no Windows code-signing certificate are configured as
# repository secrets. macOS builds will show an "unidentified developer"
# Gatekeeper warning, and Windows builds will show a SmartScreen warning,
# until real signing secrets are added (see the commented env block below)
# and this comment is updated. Do not add fabricated secret values here —
# wire real ones into repo Settings > Secrets when they exist.

jobs:
  publish-tauri:
    name: publish-tauri (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two separate macOS builds (Apple Silicon + Intel) rather than a
          # single universal binary: it keeps each build's Rust target list
          # minimal (faster CI, smaller cache) and matches the pattern in
          # Tauri's own GitHub Actions guide. Switch to
          # `--target universal-apple-darwin` with a single macos-latest
          # entry if a single universal artifact is preferred later.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing, currently NOT configured ---
          # Uncomment and add the corresponding repo secrets to produce
          # signed, notarized macOS builds and signed Windows builds.
          # Left absent, tauri-action builds unsigned installers and does
          # not fail.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CodeAtlas ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version. Builds are currently unsigned (see workflow comments / SECURITY.md)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
